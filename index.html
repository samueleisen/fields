<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Three.js Infinite Horizon | Wavy Ground & Capsule Player</title>
  <meta name="description" content="A minimalist 3D web game scene featuring a static vertical capsule player, wavy green terrain with infinite illusion horizon, and bright blue sky built with Three.js." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js ES Module Import Map (Local Vendor) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <!-- 3D Canvas Container -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Glassmorphic UI HUD -->
  <header class="hud-top">
    <div class="hud-badge">
      <span class="status-dot"></span>
      <span class="badge-title">3D Horizon Playground</span>
      <span class="badge-tag">Three.js</span>
    </div>
  </header>

  <!-- Controls Instructions Overlay -->
  <aside class="hud-card info-card">
    <h1 class="card-title">Capsule in Green Horizon</h1>
    <p class="card-desc">Static vertical capsule player standing on wavy uneven green ground beneath a bright blue sky.</p>
    <div class="controls-guide">
      <div class="guide-item">
        <span class="key-icon">W / A / S / D</span>
        <span class="guide-text">Move Character</span>
      </div>
      <div class="guide-item">
        <span class="key-icon">Left Drag</span>
        <span class="guide-text">Orbit / Look</span>
      </div>
      <div class="guide-item">
        <span class="key-icon">Scroll</span>
        <span class="guide-text">Zoom In / Out</span>
      </div>
    </div>
  </aside>

  <!-- Bottom Interactive Action Dock -->
  <nav class="hud-bottom-dock">
    <button id="btn-reset-cam" class="dock-btn" title="Reset camera to default view">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
      </svg>
      <span>Reset View</span>
    </button>
    <button id="btn-toggle-fog" class="dock-btn active" title="Toggle horizon illusion fog">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="m4.93 4.93 1.41 1.41"></path>
        <path d="m17.66 17.66 1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="m6.34 17.66-1.41 1.41"></path>
        <path d="m19.07 4.93-1.41 1.41"></path>
      </svg>
      <span id="fog-label">Horizon Fog: On</span>
    </button>
    <button id="btn-toggle-wireframe" class="dock-btn" title="Toggle ground wireframe">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span id="wireframe-label">Wireframe: Off</span>
    </button>
  </nav>

  <!-- JavaScript Entry Point -->
  <script type="module" src="main.js"></script>
</body>
</html>
